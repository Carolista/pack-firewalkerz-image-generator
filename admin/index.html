<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pack Firewalkerz :: Admin</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Lilex:ital,wght@0,100..700;1,100..700&family=New+Amsterdam&family=Sono:wght,MONO@200..800,1&family=Trade+Winds&display=swap"
			rel="stylesheet"
		/>
		<link href="../global.css" rel="stylesheet" />
		<link href="admin.css" rel="stylesheet" />
		<script
			src="https://kit.fontawesome.com/679a59d672.js"
			crossorigin="anonymous"
		></script>
		<script src="admin.js" type="module" defer></script>
	</head>
	<body>
		<header class="admin-header">
			<div>
				<h1>Pack Firewalkerz</h1>
				<p id="tagline">ADMIN PORTAL</p>
			</div>
			<div class="header-actions">
				<a href="../" target="_blank" rel="noreferrer"
					><button
						type="button"
						title="Open Image Generator Tool in a new tab"
					>
						Image Generator
						<i
							class="fa-solid fa-arrow-up-right-from-square"
						></i></button
				></a>
				<button
					id="sign-out-btn"
					type="button"
					title="Sign out of the Admin Portal"
					hidden
				>
					Sign Out <i class="fa-solid fa-right-from-bracket"></i>
				</button>
			</div>
		</header>

		<main>
			<section id="login-panel" class="panel login-panel">
				<h2 class="modal-heading">Sign in</h2>
				<form id="login-form">
					<label>
						Email
						<input
							id="email-input"
							type="email"
							autocomplete="username"
							required
						/>
					</label>
					<label>
						Password
						<input
							id="password-input"
							type="password"
							autocomplete="current-password"
							required
						/>
					</label>
					<button type="submit">
						Sign in <i class="fa-solid fa-right-to-bracket"></i>
					</button>
					<p id="login-status" class="status" role="status"></p>
				</form>
			</section>

			<section id="catalog-panel" hidden>
				<h2>ADMIN PORTAL</h2>
				<nav
					id="category-tabs"
					class="tabs"
					aria-label="Catalog categories"
				></nav>
				<div class="result-container">
					<div class="catalog-toolbar">
						<div>
							<div
								id="catalog-status"
								class="status"
								role="status"
							></div>
						</div>
						<button id="add-element-btn" type="button"></button>
					</div>
					<div id="element-list" class="element-list"></div>
				</div>
			</section>

			<section id="details-container" hidden>
				<button id="details-back-btn" type="button" class="back-button">
					<i class="fa-solid fa-square-arrow-left"></i>
					Back to Catalog
				</button>
				<div id="details-panel" class="panel">
					<div id="details-header">
						<h2 id="details-name"></h2>
						<div
							id="details-status"
							class="status"
							role="status"
						></div>
					</div>
					<div id="details-content"></div>
				</div>
			</section>

			<section id="form-container" hidden>
				<form id="element-form">
					<div class="form-header">
						<button
							id="form-back-btn"
							type="button"
							class="back-button cancel"
						>
							<i class="fa-solid fa-square-arrow-left"></i>
							Back to catalog
						</button>
						<h2 id="form-heading">Add new element</h2>
					</div>
					<div id="form-panel" class="panel">
						<label>
							Category*
							<select id="form-category" required></select>
						</label>
						<label>
							Name *
							<input id="form-name" required />
						</label>
						<label>
							Slug*
							<input
								id="form-slug"
								required
								pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
							/>
						</label>
						<div>
							<div class="form-section-heading">
								<h3 class="variant-heading">Variants</h3>
							</div>
							<div id="variant-form-rows"></div>
						</div>
					</div>
					<div class="edit-button-group form-actions">
						<button id="add-variant-btn" type="button">
							<i class="fa-solid fa-square-plus"></i>
							Add variant
						</button>
						<div>
							<p
								id="form-status"
								class="status"
								role="status"
							></p>
						</div>
						<div>
							<button
								id="form-cancel-btn"
								type="button"
								class="cancel"
							>
								<i class="fa-solid fa-square-xmark"></i> Cancel
							</button>
							<button id="form-save-btn" type="submit">
								<i class="fa-solid fa-floppy-disk"></i> Save
							</button>
						</div>
					</div>
				</form>
			</section>

			<div id="reauth-modal-overlay" class="modal-overlay" hidden>
				<div
					class="modal"
					role="dialog"
					aria-modal="true"
					aria-labelledby="reauth-modal-heading"
				>
					<h2 id="reauth-modal-heading" class="modal-heading">
						Session expired
					</h2>
					<p>Please sign in again to continue.</p>
					<form id="reauth-form">
						<label>
							Email
							<input
								id="reauth-email-input"
								type="email"
								autocomplete="username"
								required
							/>
						</label>
						<label>
							Password
							<input
								id="reauth-password-input"
								type="password"
								autocomplete="current-password"
								required
							/>
						</label>
						<button type="submit">
							Sign In
							<i class="fa-solid fa-right-to-bracket"></i>
						</button>
						<p id="reauth-status" class="status" role="status"></p>
					</form>
				</div>
			</div>

			<div id="confirm-modal-overlay" class="modal-overlay" hidden>
				<div
					class="modal"
					role="dialog"
					aria-modal="true"
					aria-labelledby="confirm-modal-heading"
					aria-describedby="confirm-modal-message"
				>
					<h2 id="confirm-modal-heading" class="modal-heading">
						Confirm deletion
					</h2>
					<p id="confirm-modal-message"></p>
					<div class="confirm-actions">
						<button id="confirm-modal-cancel-btn" type="button">
							Cancel
						</button>
						<button
							id="confirm-modal-extra-btn"
							type="button"
							hidden
						></button>
						<button
							id="confirm-modal-confirm-btn"
							type="button"
							class="delete"
						>
							Delete
						</button>
					</div>
				</div>
			</div>
		</main>
	</body>
</html>
