<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pack Firewalkerz :: Admin</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Lilex:ital,wght@0,100..700;1,100..700&family=New+Amsterdam&display=swap"
			rel="stylesheet"
		/>
		<link href="admin.css" rel="stylesheet" />
		<script src="admin.js" type="module" defer></script>
	</head>
	<body>
		<header class="admin-header">
			<div>
				<p class="eyebrow">Pack Firewalkerz</p>
				<h1>Catalog Admin</h1>
			</div>
			<div class="header-actions">
				<a href="../" target="_blank" rel="noreferrer"
					>Open generator</a
				>
				<button id="signOutBtn" type="button" hidden>Sign out</button>
			</div>
		</header>

		<main>
			<section id="loginPanel" class="panel login-panel">
				<p class="eyebrow">Private workspace</p>
				<h2>Sign in</h2>
				<form id="loginForm">
					<label>
						Email
						<input
							id="emailInput"
							type="email"
							autocomplete="username"
							required
						/>
					</label>
					<label>
						Password
						<input
							id="passwordInput"
							type="password"
							autocomplete="current-password"
							required
						/>
					</label>
					<button type="submit">Sign in</button>
					<p id="loginStatus" class="status" role="status"></p>
				</form>
			</section>

			<section id="catalogPanel" hidden>
				<div class="catalog-toolbar">
					<div>
						<p class="eyebrow">Catalog</p>
						<h2 id="categoryHeading">Player Characters</h2>
					</div>
					<button id="addElementBtn" type="button">Add new</button>
				</div>
				<nav
					id="categoryTabs"
					class="tabs"
					aria-label="Catalog categories"
				></nav>
				<div id="catalogStatus" class="status" role="status"></div>
				<div id="elementList" class="element-list"></div>
			</section>

			<section id="detailsPanel" class="panel" hidden>
				<button id="detailsBackBtn" type="button">
					Back to catalog
				</button>
				<div id="detailsContent"></div>
			</section>

			<section id="formPanel" class="panel" hidden>
				<button id="formBackBtn" type="button">Back to catalog</button>
				<h2 id="formHeading">Add element</h2>
				<form id="elementForm">
					<label>
						Category
						<select id="formCategory" required></select>
					</label>
					<label>
						Name
						<input id="formName" required />
					</label>
					<label>
						Slug
						<input
							id="formSlug"
							required
							pattern="[a-z0-9]+(?:-[a-z0-9]+)*"
						/>
					</label>
					<div>
						<div class="form-section-heading">
							<h3>Variants</h3>
							<button id="addVariantBtn" type="button">
								Add variant
							</button>
						</div>
						<div id="variantFormRows"></div>
					</div>
					<button type="submit">Save</button>
					<p id="formStatus" class="status" role="status"></p>
				</form>
			</section>
		</main>
	</body>
</html>
