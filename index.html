<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Pack Firewalkerz :: Image Generator</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Libertinus+Sans:ital,wght@0,400;0,700;1,400&family=Lilex:ital,wght@0,100..700;1,100..700&family=Major+Mono+Display&family=New+Amsterdam&family=Sono:wght,MONO@200..800,1&family=Trade+Winds&display=swap"
			rel="stylesheet"
		/>

		<link href="styles.css" rel="stylesheet" />
		<script src="script.js" type="module" defer></script>
	</head>
	<body>
		<h1>Pack Firewalkerz</h1>
		<h2>Image Generator</h2>

		<!-- Character Selector -->
		<div class="card">
			<h3>Characters & Forms</h3>
			<div id="characterRows"></div>
			<button id="addCharacterBtn" type="button">
				Add another character
			</button>
		</div>

		<div class="card">
			<h3>Setting</h3>
			<div class="field">
				<label for="locationSelect">Scene Location</label>
				<select id="locationSelect"></select>
			</div>
			<div class="field">
				<p id="locationDescText"></p>
				<textarea
					id="otherLocationText"
					placeholder="Describe the custom location/setting"
					hidden
				></textarea>
			</div>
		</div>

		<!-- Scene Action -->
		<div class="card">
			<h3>SCENE DESCRIPTION</h3>
			<div class="field">
				<label for="sceneText"
					>Description of characters' facial expressions, placement
					within setting, actions, props, etc.
				</label>
				<textarea
					id="sceneText"
					placeholder="e.g., Dmitri is standing on a dumpster, trying to press tiny buttons on an iPhone to take a photo while still in Crinos form, looking deeply frustrated."
				></textarea>
			</div>
			<button id="generateBtn">Generate Image</button>
			<button id="resetBtn" type="button">Reset Scene</button>
		</div>

		<!-- Output Area -->
		<div class="card">
			<h3>IMAGE</h3>
			<div id="statusText">Waiting for prompt...</div>
			<button id="retryBtn" type="button" style="display: none">
				Retry
			</button>
			<div id="imagePlaceholder" class="image-placeholder" hidden>
				<span class="image-spinner" aria-hidden="true"></span>
			</div>
			<img id="outputImg" alt="Generated Scene" />
			<div style="margin-top: 0.5rem">
				<button id="shareBtn" style="display: none">
					Share to Device
				</button>
			</div>
		</div>
	</body>
</html>
