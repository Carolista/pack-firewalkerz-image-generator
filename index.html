<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Pack Generator - WW20</title>
		<link href="styles.css" rel="stylesheet" />
		<script src="script.js" type="module" defer></script>
	</head>
	<body>
		<h1>🐺 WW20 Scene Visualizer</h1>

		<!-- API Key Setup (Kept local for personal app) -->
		<div class="card">
			<div class="field">
				<label for="apiKey">Gemini API Key</label>
				<input
					type="password"
					id="apiKey"
					placeholder="Paste your Google AI Studio API key here" />
			</div>
		</div>

		<!-- Character Selector -->
		<div class="card">
			<h3>Characters & Forms</h3>
			<div id="characterRows"></div>
			<button id="addCharacterBtn" type="button">
				+ Add another character
			</button>
		</div>

		<div class="card">
			<h3>Setting</h3>
			<div class="field">
				<label for="locationSelect">Select Location</label>
				<select id="locationSelect"></select>
			</div>
			<div class="field">
				<p id="locationDescText"></p>
				<textarea
					id="otherLocationText"
					placeholder="Describe the custom location/setting"
					hidden></textarea>
			</div>
		</div>

		<!-- Scene Action -->
		<div class="card">
			<div class="field">
				<label for="sceneText">Describe Scene & Actions</label>
				<textarea
					id="sceneText"
					placeholder="e.g. Trying to press tiny buttons on an iPhone while in 8-foot Crinos form and looking deeply frustrated."></textarea>
			</div>
			<button id="generateBtn">Generate Image</button>
			<button id="resetBtn" type="button">Reset Scene</button>
		</div>

		<!-- Output Area -->
		<div class="card">
			<div id="statusText">Ready.</div>
			<img id="outputImg" alt="Generated Scene" />
			<div style="margin-top: 0.5rem">
				<button id="shareBtn" style="display: none">Share to Device</button>
			</div>
		</div>
	</body>
</html>
